name: Build OurAirports dataset

on:
  workflow_dispatch:
  push:
    paths:
      - "data/wizz_network_icao.txt"
      - "data/wizz_bases_iata.txt"
      - "tools/build_airports.py"
      - ".github/workflows/build-data.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dataset
        run: |
          python3 tools/build_airports.py

      - name: Commit updated data (if changed)
        run: |
          if git status --porcelain | grep -E "data/airports.min.json|data/packs.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/airports.min.json data/packs.json
            git commit -m "Update airports dataset"
            git push
          else
            echo "No data changes to commit."
          fi
