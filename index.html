<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>icao-iata-trainer</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
 <div class="grid grid-2col">
  <div class="maincol">

    <!-- a meglévő kártyáid maradhatnak itt -->
    <!-- NEM kell mindent átírni: csak tedd bele ide a mostani card-jaidat -->
    <!-- Kezdés: -->
    <div class="card">
      <!-- a mostani Progress/Home kártyád teljes tartalmát hagyd itt -->
    </div>

    <!-- a mostani data-view="home/srs/rapid/map/drill" card-jaid is maradhatnak itt -->
    <!-- Vége -->

  </div>

  <div class="sidebar">

    <div class="card" id="history">
      <div class="card-h">
        <h2>History</h2>
        <span class="badge">this run</span>
      </div>
      <div class="card-b">
        <div id="history-meta" class="smallmuted">—</div>
        <div id="history-list" class="history"></div>
        <div class="row" style="margin-top:10px;">
          <button class="ghost" id="history-clear">Clear</button>
        </div>
      </div>
    </div>

    <div class="card" id="leaderboard" style="margin-top:14px;">
      <div class="card-h">
        <h2>Scoreboard</h2>
        <span class="badge">shared</span>
      </div>
      <div class="card-b">
        <div class="row" style="gap:10px; flex-wrap:wrap; align-items:center;">
          <button class="ghost" id="lb-refresh">Refresh</button>
          <button class="primary" id="lb-submit">Submit last run</button>
          <span class="smallmuted" id="lb-status">—</span>
        </div>
        <div id="lb-list" style="margin-top:10px;"></div>
        <div class="smallmuted" style="margin-top:10px;">
          Uses GitHub Issues (no backend).
        </div>
      </div>
    </div>

  </div>
</div>
<script type="module">
    // Cache-bust + friendly error if files are missing
    import('./assets/app.js?v=3.1.0')
      .catch((err)=>{
        console.error(err);
        const el = document.getElementById('fatal-error') || document.createElement('div');
        el.id = 'fatal-error';
        el.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;background:#1b1b1b;color:#fff;padding:12px 14px;border-radius:12px;z-index:99999;font-family:system-ui;line-height:1.35;';
        el.innerHTML = '<b>App failed to load.</b><br/>This usually means some <code>assets/</code> files were not uploaded (or are in a subfolder).<br/><br/>Fix: upload the <b>entire</b> <code>assets/</code> and <code>data/</code> folders from the ZIP into the repo root. Then hard refresh.';
        document.body.appendChild(el);
      });
  </script>
</body>
</html>
